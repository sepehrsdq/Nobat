<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 425" width="1600" height="425" role="img" aria-label="نوبت — نوبت‌دهی مطب">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F7F6" />
      <stop offset="0.55" stop-color="#F1F4F2" />
      <stop offset="1" stop-color="#E7F1EE" />
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B6B62" />
      <stop offset="1" stop-color="#095A52" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#0B6B62" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1600" height="425" fill="url(#paper)" />
  <rect width="1600" height="425" fill="url(#grid)" />

  <!-- soft brand wash -->
  <ellipse cx="1440" cy="60" rx="320" ry="220" fill="#0B6B62" fill-opacity="0.07" />
  <ellipse cx="180" cy="400" rx="260" ry="180" fill="#B45309" fill-opacity="0.06" />

  <!-- calendar, leaning slightly, at the reading start of the banner -->
  <g transform="translate(1010 52) rotate(-4)">
    <rect x="0" y="26" width="440" height="300" rx="26" fill="#0F1D24" fill-opacity="0.06" />
    <rect x="0" y="10" width="440" height="300" rx="26" fill="#FFFFFF" stroke="#DBE1E3" stroke-width="2" />
    <path d="M26 10h388a26 26 0 0 1 26 26v48H0V36a26 26 0 0 1 26-26z" fill="url(#brand)" />
    <circle cx="72" cy="8" r="9" fill="#0B6B62" />
    <circle cx="368" cy="8" r="9" fill="#0B6B62" />
    <circle cx="72" cy="8" r="4" fill="#E3F2EF" />
    <circle cx="368" cy="8" r="4" fill="#E3F2EF" />
    <rect x="26" y="112" width="58" height="10" rx="5" fill="#E3F2EF" />
    <rect x="26" y="128" width="34" height="8" rx="4" fill="#E3F2EF" />

    <!-- day cells -->
    <g>
      <rect x="26" y="156" width="86" height="56" rx="12" fill="#F6F7F6" stroke="#DBE1E3" stroke-width="2" />
      <rect x="128" y="156" width="86" height="56" rx="12" fill="#E3F2EF" />
      <rect x="230" y="156" width="86" height="56" rx="12" fill="#F6F7F6" stroke="#DBE1E3" stroke-width="2" />
      <rect x="332" y="156" width="82" height="56" rx="12" fill="#F6F7F6" stroke="#DBE1E3" stroke-width="2" />

      <rect x="26" y="228" width="86" height="56" rx="12" fill="#E3F2EF" />
      <rect x="128" y="228" width="86" height="56" rx="12" fill="#F6F7F6" stroke="#DBE1E3" stroke-width="2" />
      <rect x="230" y="228" width="86" height="56" rx="12" fill="url(#brand)" />
      <rect x="332" y="228" width="82" height="56" rx="12" fill="#F6F7F6" stroke="#DBE1E3" stroke-width="2" />

      <rect x="26" y="300" width="86" height="0" rx="12" fill="#F6F7F6" />
    </g>

    <!-- the one booked slot -->
    <path d="M256 256l14 14 26-28" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <rect x="26" y="300" width="196" height="52" rx="14" fill="#FDF4E8" stroke="#F2D6B4" stroke-width="2" />
    <circle cx="56" cy="326" r="10" fill="#B45309" />
    <rect x="78" y="316" width="118" height="9" rx="4.5" fill="#E7C79F" />
    <rect x="78" y="332" width="74" height="8" rx="4" fill="#F0DCC2" />
  </g>

  <!-- day column: slots -->
  <g transform="translate(790 66)">
    <rect x="0" y="0" width="176" height="300" rx="24" fill="#FFFFFF" fill-opacity="0.85" stroke="#DBE1E3" stroke-width="2" />
    <rect x="20" y="24" width="74" height="10" rx="5" fill="#DBE1E3" />
    <rect x="20" y="56" width="136" height="34" rx="12" fill="#E3F2EF" />
    <rect x="20" y="102" width="136" height="34" rx="12" fill="#E3F2EF" />
    <rect x="20" y="148" width="136" height="34" rx="12" fill="#FFFFFF" stroke="#0B6B62" stroke-width="2" />
    <rect x="20" y="194" width="136" height="34" rx="12" fill="#E3F2EF" />
    <rect x="20" y="240" width="80" height="34" rx="12" fill="#E3F2EF" fill-opacity="0.5" />
    <circle cx="140" cy="165" r="7" fill="#0B6B62" />
  </g>

  <!-- patient card: name + phone, abstract -->
  <g transform="translate(430 96)">
    <rect x="0" y="0" width="300" height="168" rx="22" fill="#FFFFFF" stroke="#DBE1E3" stroke-width="2" />
    <circle cx="52" cy="52" r="26" fill="#E3F2EF" />
    <path d="M52 44a9 9 0 1 1 0 18 9 9 0 0 1 0-18z" fill="#0B6B62" />
    <path d="M36 72c3-9 9-13 16-13s13 4 16 13" fill="none" stroke="#0B6B62" stroke-width="4" stroke-linecap="round" />
    <rect x="96" y="38" width="132" height="12" rx="6" fill="#0F1D24" fill-opacity="0.65" />
    <rect x="96" y="60" width="86" height="9" rx="4.5" fill="#DBE1E3" />
    <rect x="26" y="108" width="248" height="1" fill="#DBE1E3" />
    <rect x="26" y="126" width="64" height="9" rx="4.5" fill="#DBE1E3" />
    <rect x="104" y="126" width="96" height="9" rx="4.5" fill="#0B6B62" fill-opacity="0.55" />
    <rect x="216" y="126" width="58" height="9" rx="4.5" fill="#DBE1E3" />
  </g>

  <!-- small links between the three objects -->
  <g stroke="#0B6B62" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6 8" fill="none">
    <path d="M736 180h48" />
    <path d="M972 208h32" />
  </g>

  <!-- accent dots -->
  <g fill="#0B6B62" fill-opacity="0.35">
    <circle cx="60" cy="70" r="4" />
    <circle cx="92" cy="70" r="4" />
    <circle cx="124" cy="70" r="4" />
    <circle cx="60" cy="102" r="4" />
    <circle cx="92" cy="102" r="4" />
  </g>
  <circle cx="1520" cy="352" r="10" fill="#B45309" fill-opacity="0.55" />
  <circle cx="1500" cy="386" r="5" fill="#0B6B62" fill-opacity="0.4" />
</svg>
